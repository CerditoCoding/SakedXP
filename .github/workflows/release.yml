# Push a tag like v0.3.1 and this builds SakedXP-v0.3.1.zip as a GitHub release.
# WowUp picks up new releases automatically.
# (No external packager: WoW Forever's interface version isn't known to them.)
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build zip
        run: |
          mkdir -p .release/SakedXP
          rsync -a ./ .release/SakedXP/ \
            --exclude .git --exclude .github --exclude .release \
            --exclude .gitignore --exclude .pkgmeta --exclude README.md
          cd .release
          zip -qr "SakedXP-${GITHUB_REF_NAME}.zip" SakedXP
          ls -l

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ".release/SakedXP-${GITHUB_REF_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SakedXP ${GITHUB_REF_NAME}" \
            --generate-notes
